name: Update TSETMC Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update market data
        run: python scripts/update_tsetmc.py
      - name: Commit data
        run: |
          git config user.name "tsetmc-bot"
          git config user.email "tsetmc-bot@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Update TSETMC market data"
          git push
